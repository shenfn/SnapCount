name: Release Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PWA, Edge, migrations, and Shadow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: security-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PWA dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build

      - name: Validate unified pending queue
        run: npm run test:pending-queue

      - name: Install trace console dependencies
        working-directory: tools/ai-validation/ui/trace-console
        run: npm ci

      - name: Build trace console
        working-directory: tools/ai-validation/ui/trace-console
        run: npm run build

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Check expression core boundary
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/index.mjs') != '' }}
        run: npm run check:expression-core-boundary

      - name: Test expression core in Node
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/node.test.mjs') != '' }}
        run: npm run test:expression-core

      - name: Test expression plan selection in Node
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/plan-selection.node.test.mjs') != '' }}
        run: npm run test:expression-plan-selection

      - name: Test expression plan selection wrapper compatibility
        if: ${{ hashFiles('scripts/test-expression-plan-wrapper-compat.mjs') != '' }}
        run: npm run test:expression-plan-wrapper-compat

      - name: Test expression eligibility in Node
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/eligibility.node.test.mjs') != '' }}
        run: npm run test:expression-eligibility

      - name: Test expression eligibility wrapper compatibility
        if: ${{ hashFiles('scripts/test-eligibility-wrapper-compat.mjs') != '' }}
        run: npm run test:expression-eligibility-wrapper-compat

      - name: Test expression scoring in Node
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/scoring.node.test.mjs') != '' }}
        run: npm run test:expression-scoring

      - name: Test expression scoring wrapper compatibility
        if: ${{ hashFiles('scripts/test-scoring-wrapper-compat.mjs') != '' }}
        run: npm run test:expression-scoring-wrapper-compat

      - name: Test expression fact candidates in Node
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/fact-candidates.node.test.mjs') != '' }}
        run: npm run test:expression-fact-candidates

      - name: Test expression fact candidates wrapper compatibility
        if: ${{ hashFiles('scripts/test-fact-candidates-wrapper-compat.mjs') != '' }}
        run: npm run test:expression-fact-candidates-wrapper-compat

      - name: Test expression recurrence in Node
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/recurrence.node.test.mjs') != '' }}
        run: npm run test:expression-recurrence

      - name: Test expression recurrence wrapper compatibility
        if: ${{ hashFiles('scripts/test-recurrence-wrapper-compat.mjs') != '' }}
        run: npm run test:expression-recurrence-wrapper-compat

      - name: Test expression comparison in Node
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/comparison.node.test.mjs') != '' }}
        run: npm run test:expression-comparison

      - name: Test expression comparison wrapper compatibility
        if: ${{ hashFiles('scripts/test-comparison-wrapper-compat.mjs') != '' }}
        run: npm run test:expression-comparison-wrapper-compat

      - name: Test expression cross-record in Node
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/cross-record.node.test.mjs') != '' }}
        run: npm run test:expression-cross-record

      - name: Test expression cross-record wrapper compatibility
        if: ${{ hashFiles('scripts/test-cross-record-wrapper-compat.mjs') != '' }}
        run: npm run test:expression-cross-record-wrapper-compat

      - name: Test expression entity normalizer in Node
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/entity-normalizer.node.test.mjs') != '' }}
        run: npm run test:expression-entity-normalizer

      - name: Test expression entity normalizer wrapper compatibility
        if: ${{ hashFiles('scripts/test-entity-normalizer-wrapper-compat.mjs') != '' }}
        run: npm run test:expression-entity-normalizer-wrapper-compat

      - name: Test expression generic domain in Node
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/generic-domain.node.test.mjs') != '' }}
        run: npm run test:expression-generic-domain

      - name: Test expression generic domain wrapper compatibility
        if: ${{ hashFiles('scripts/test-generic-domain-wrapper-compat.mjs') != '' }}
        run: npm run test:expression-generic-domain-wrapper-compat

      - name: Test expression render contract in Node
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/render-contract.node.test.mjs') != '' }}
        run: npm run test:expression-render-contract

      - name: Test expression render contract wrapper compatibility
        if: ${{ hashFiles('scripts/test-render-contract-wrapper-compat.mjs') != '' }}
        run: npm run test:expression-render-contract-wrapper-compat

      - name: Compare expression core and fallback with legacy behavior
        if: ${{ hashFiles('supabase/functions/_shared/contracts/表达核心-旧行为对比-v0.1.json') != '' }}
        run: npm run test:expression-core-compat

      - name: Test expression core in Deno
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/deno_test.mjs') != '' }}
        run: deno test --no-lock --allow-read=supabase/functions/_shared/contracts supabase/functions/_shared/expression-core/deno_test.mjs

      - name: Test expression plan selection in Deno
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/plan-selection.deno_test.mjs') != '' }}
        run: deno test --no-lock --allow-read=supabase/functions/_shared/contracts supabase/functions/_shared/expression-core/plan-selection.deno_test.mjs

      - name: Test expression eligibility in Deno
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/eligibility.deno_test.mjs') != '' }}
        run: deno test --no-lock --allow-read=supabase/functions/_shared/contracts supabase/functions/_shared/expression-core/eligibility.deno_test.mjs

      - name: Test expression scoring in Deno
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/scoring.deno_test.mjs') != '' }}
        run: deno test --no-lock --allow-read=supabase/functions/_shared/contracts supabase/functions/_shared/expression-core/scoring.deno_test.mjs

      - name: Test expression fact candidates in Deno
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/fact-candidates.deno_test.mjs') != '' }}
        run: deno test --no-lock --allow-read=supabase/functions/_shared/contracts supabase/functions/_shared/expression-core/fact-candidates.deno_test.mjs

      - name: Test expression recurrence in Deno
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/recurrence.deno_test.mjs') != '' }}
        run: deno test --no-lock --allow-read=supabase/functions/_shared/contracts supabase/functions/_shared/expression-core/recurrence.deno_test.mjs

      - name: Test expression comparison in Deno
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/comparison.deno_test.mjs') != '' }}
        run: deno test --no-lock --allow-read=supabase/functions/_shared/contracts supabase/functions/_shared/expression-core/comparison.deno_test.mjs

      - name: Test expression cross-record in Deno
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/cross-record.deno_test.mjs') != '' }}
        run: deno test --no-lock --allow-read=supabase/functions/_shared/contracts supabase/functions/_shared/expression-core/cross-record.deno_test.mjs

      - name: Test expression entity normalizer in Deno
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/entity-normalizer.deno_test.mjs') != '' }}
        run: deno test --no-lock --allow-read=supabase/functions/_shared/contracts supabase/functions/_shared/expression-core/entity-normalizer.deno_test.mjs

      - name: Test expression generic domain in Deno
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/generic-domain.deno_test.mjs') != '' }}
        run: deno test --no-lock --allow-read=supabase/functions/_shared/contracts supabase/functions/_shared/expression-core/generic-domain.deno_test.mjs

      - name: Test expression render contract in Deno
        if: ${{ hashFiles('supabase/functions/_shared/expression-core/render-contract.deno_test.mjs') != '' }}
        run: deno test --no-lock --allow-read=supabase/functions/_shared/contracts supabase/functions/_shared/expression-core/render-contract.deno_test.mjs

      - name: Check Edge Functions
        run: |
          deno check --no-lock --node-modules-dir=auto supabase/functions/generate-insights/index.ts
          deno check --no-lock --node-modules-dir=auto supabase/functions/ingest-receipt/index.ts

      - name: Test receipt safeguards
        run: deno test --no-lock supabase/functions/ingest-receipt/duplicate-review_test.ts supabase/functions/ingest-receipt/signals_test.ts supabase/functions/ingest-receipt/context-packet_test.ts supabase/functions/ingest-receipt/prompts_test.ts supabase/functions/ingest-receipt/expression-shadow_test.ts supabase/functions/ingest-receipt/notification-text_test.ts supabase/functions/ingest-receipt/time_test.ts supabase/functions/ingest-receipt/time-language_test.ts supabase/functions/ingest-receipt/voice-output_test.ts

      - name: Run Shadow Planner tests
        run: node --test tools/ai-validation/expression-planner/tests/*.test.mjs

      - name: Validate migration versions
        run: node scripts/check-migration-versions.mjs

      - name: Validate adaptive finance options
        run: npm run test:finance-options

      - name: Validate finance occurrence contract
        run: npm run test:finance-occurred-at

      - name: Validate day record time labels
        run: npm run test:day-time-display

      - name: Validate expression presentation contract
        run: npm run test:expression-presentation

      - name: Validate receipt duplicate review contracts
        run: npm run check:receipt-dedup

      - name: Validate security contracts
        run: npm run check:security-contracts

      - name: Validate test registration consent metadata
        run: node --test scripts/test-registration-consent-helper.test.mjs

      - name: Validate production smoke scripts
        run: |
          node --check scripts/test-ingest-receipt.mjs
          node --check scripts/cleanup-test-receipts.mjs
          node --check scripts/test-upload-lifecycle.mjs

      - name: Execute finance occurrence migration contract
        env:
          PGROOT: postgresql://postgres:security-test@localhost:5432/postgres
          PGURL: postgresql://postgres:security-test@localhost:5432/finance_time_contract
        run: |
          psql "$PGROOT" -v ON_ERROR_STOP=1 -c "create database finance_time_contract"
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/test-finance-occurred-at-migration-fixture.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260808120000_finance_occurred_at_contract.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260808120000_finance_occurred_at_contract.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/test-finance-occurred-at-migration.sql

      - name: Execute security migrations
        env:
          PGURL: postgresql://postgres:security-test@localhost:5432/postgres
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/security-migration-fixture.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260719220000_registration_consent_and_private_defaults.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260720100000_harden_privileged_rpcs_and_receipt_storage.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260721110000_user_finance_vocabulary.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260721190000_finance_perceptual_duplicate_review.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260722100000_staging_discard_cleanup_and_archive_feedback.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260722110000_invalidate_deleted_record_context.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260722120000_expression_improvement_privacy_controls.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260725120000_expression_feedback_positive_choices.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260725123000_expression_feedback_atomic_bundle.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260725124000_expression_record_delete_cleanup.sql
          # Exercise the deployed-bug upgrade path, then prove the hotfix is idempotent.
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/test-expression-feedback-signal-key-hotfix-fixture.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260726121000_fix_expression_feedback_signal_key_precedence.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260726121000_fix_expression_feedback_signal_key_precedence.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260806100000_personal_context_memory_contract.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/test-security-migration.sql
