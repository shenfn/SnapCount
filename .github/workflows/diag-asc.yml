name: ASC Credential Diagnostic

on:
  workflow_dispatch:

jobs:
  diag:
    name: Probe App Store Connect credentials
    runs-on: macos-26

    steps:
      - name: Decode API key
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_B64" | base64 --decode -o "$RUNNER_TEMP/keys/key.p8"
          echo "key-file-bytes=$(wc -c < "$RUNNER_TEMP/keys/key.p8" | tr -d ' ')"
          echo "key-id-len=${#KEY_ID}"
          echo "key-id-looks-like=${KEY_ID:0:2}***${KEY_ID: -2}"
          echo "pem header: $(head -1 "$RUNNER_TEMP/keys/key.p8")"
          openssl pkey -in "$RUNNER_TEMP/keys/key.p8" -noout -text 2>&1 | head -2

      - name: Mint JWT and query apps
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/keys/key.p8" <<'PY' > "$RUNNER_TEMP/token.txt"
          import base64, json, os, subprocess, sys, time

          key_path, key_id, issuer = sys.argv[1], os.environ["KEY_ID"], os.environ["ISSUER"]

          def b64u(b):
              return base64.urlsafe_b64encode(b).rstrip(b"=")

          header = {"alg": "ES256", "kid": key_id, "typ": "JWT"}
          now = int(time.time())
          payload = {"iss": issuer, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"}
          signing_input = b".".join([
              b64u(json.dumps(header, separators=(",", ":")).encode()),
              b64u(json.dumps(payload, separators=(",", ":")).encode()),
          ])
          der = subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", key_path, "-binary"],
              input=signing_input, capture_output=True, check=True,
          ).stdout

          def read_len(buf, i):
              ln = buf[i]
              i += 1
              if ln & 0x80:
                  n = ln & 0x7F
                  ln = int.from_bytes(buf[i:i + n], "big")
                  i += n
              return ln, i

          def read_int(buf, i):
              assert buf[i] == 0x02, buf[i]
              ln, i = read_len(buf, i + 1)
              return int.from_bytes(buf[i:i + ln], "big"), i + ln

          i = 0
          assert der[i] == 0x30
          _, i = read_len(der, i + 1)
          r, i = read_int(der, i)
          s, i = read_int(der, i)

          print((signing_input + b"." + b64u(r.to_bytes(32, "big") + s.to_bytes(32, "big"))).decode())
          PY

          TOKEN=$(cat "$RUNNER_TEMP/token.txt")
          echo "token-len=${#TOKEN}"
          echo "token-parts=$(awk -F. '{print NF}' <<< "$TOKEN")"

          probe() {
            local label="$1" url="$2"
            local code
            code=$(curl -sS -o "$RUNNER_TEMP/body.json" -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" "$url" || echo "000")
            echo "--- $label -> HTTP $code"
            head -c 700 "$RUNNER_TEMP/body.json" || true
            echo
          }

          probe "apps?filter[bundleId]=com.jiezi.app" \
            'https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=com.jiezi.app&limit=5'
          probe "apps (first 3, no filter)" \
            'https://api.appstoreconnect.apple.com/v1/apps?limit=3'
          probe "bundleIds?filter[identifier]=com.jiezi.app" \
            'https://api.appstoreconnect.apple.com/v1/bundleIds?filter%5Bidentifier%5D=com.jiezi.app&limit=5'
