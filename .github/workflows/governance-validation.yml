name: Governance Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'docs/**'
      - 'test/**'
      - 'chore/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Governance entry and branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check governance chain
        run: npm run --if-present governance:check

      - name: Check architecture dependency ratchet
        run: npm run --if-present governance:arch
